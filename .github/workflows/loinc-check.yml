name: LOINC

# Agendado, e não por PR. O check precisa de credencial e de rede: em todo PR
# ficaria lento e instável, e secret não é exposto a PR de fork em repo público.
# O LOINC está migrando para release mensal, então o cron acompanha a cadência
# do que está sendo observado.
on:
  schedule:
    # Dia 5, 06:00 UTC — depois da virada do mês, sem cair no pico da meia-noite.
    - cron: '0 6 5 * *'
  workflow_dispatch:
    inputs:
      update:
        description: 'Regravar o snapshot e abrir PR com a mudança'
        type: boolean
        default: false

permissions:
  contents: read

# Uma execução por vez. O modo update não escreve na main — abre PR — então
# duas execuções simultâneas não corrompem nada, mas abririam dois PRs com o
# mesmo conteúdo e gastariam o dobro de chamadas ao LOINC à toa.
concurrency:
  group: loinc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Códigos LOINC
    if: ${{ !inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Conferir códigos contra o fhir.loinc.org
        env:
          LOINC_USER: ${{ secrets.LOINC_USER }}
          LOINC_PASSWORD: ${{ secrets.LOINC_PASSWORD }}
        run: |
          code=0
          pnpm loinc:check || code=$?
          # 2 é "não deu para conferir" — LOINC fora do ar, rede bloqueada,
          # credencial recusada. Indisponibilidade de terceiro não pode virar
          # falha nossa, mas também não pode passar por sucesso silencioso.
          if [ "$code" = "2" ]; then
            echo "::warning::LOINC indisponível; códigos não verificados nesta execução"
            exit 0
          fi
          exit "$code"

  update:
    name: Regravar snapshot
    if: ${{ inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Regravar o snapshot
        env:
          LOINC_USER: ${{ secrets.LOINC_USER }}
          LOINC_PASSWORD: ${{ secrets.LOINC_PASSWORD }}
        run: pnpm loinc:update
      # Aceitar deriva é PR revisado, nunca commit automático na main: uma
      # mudança de nome upstream pode significar que o código deixou de servir
      # para o analito, e isso precisa de olho humano.
      - name: Abrir PR com o snapshot novo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SNAP=scripts/loinc-snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` antes de comparar, e comparar contra o índice.
          # `git diff --quiet -- <arquivo>` ignora arquivo não rastreado e sai 0,
          # então o primeiro snapshot de todos — que é justamente o caso do
          # bootstrap — era gerado, dado como "sem mudança" e descartado.
          git add "$SNAP"
          if git diff --cached --quiet -- "$SNAP"; then
            echo "::notice::Snapshot já estava atualizado; nada a propor."
            exit 0
          fi
          branch="chore/loinc-snapshot-$(date -u +%Y%m%d%H%M)"
          git checkout -b "$branch"
          # Cada -m vira um parágrafo. Precisam caber em menos de 100 colunas:
          # o commit-msg roda commitlint aqui também, e `body-max-line-length`
          # recusa parágrafo numa linha só — foi o que derrubou o bootstrap.
          git commit \
            -m "chore(core): atualiza o snapshot de códigos LOINC" \
            -m "Gerado pelo workflow LOINC em modo update." \
            -m "Conferir cada mudança de nome ou status antes de aprovar." \
            -m "Nome novo pode significar que o código deixou de servir para o analito."
          git push -u origin "$branch"
          # A branch com o snapshot já está publicada aqui — o trabalho não se
          # perde a partir deste ponto.
          #
          # Abrir o PR pode não ser permitido: o repositório mantém
          # `can_approve_pull_request_reviews: false`, que também bloqueia
          # criação de PR pelo GITHUB_TOKEN. Isso é postura de segurança
          # deliberada, então o workflow se adapta a ela em vez de exigir que
          # ela mude — cai para imprimir o link pronto.
          if gh pr create --fill --base main --head "$branch"; then
            exit 0
          fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          echo "::notice::Branch publicada: $branch"
          echo "::notice::Abrir PR manualmente: $url"
          echo "### Snapshot de LOINC pronto para revisão" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch \`$branch\` publicada. [Abrir PR]($url)" >> "$GITHUB_STEP_SUMMARY"
